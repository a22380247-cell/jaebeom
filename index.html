<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현준이의 플래피 버디</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            user-select: none;
            touch-action: manipulation;
            background: linear-gradient(to bottom, #70c5ce, #b4f8c8);
        }

        .game-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen m-0 overflow-hidden p-4">

    <div class="text-center mb-2">
        <h1 class="text-3xl md:text-4xl text-white drop-shadow-[0_4px_3px_rgba(0,0,0,0.3)] tracking-wide">🐥 현준이의 플래피 버디 🐥</h1>
    </div>

    <!-- 게임 화면 컨테이너 -->
    <div id="gameContainer" class="relative w-full max-w-[400px] aspect-[3/4] bg-[#70c5ce] rounded-3xl overflow-hidden game-shadow border-4 border-white transition-colors duration-500">
        <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

        <!-- 시작 화면 오버레이 -->
        <div id="startScreen" class="absolute inset-0 bg-black/30 flex flex-col items-center justify-center text-white z-10 p-4 text-center backdrop-blur-[2px] overflow-y-auto">
            <div class="bg-white/20 p-4 rounded-3xl border-2 border-white/40 shadow-lg w-full max-w-[320px]">
                <div id="previewEmoji" class="text-4xl mb-1 block animate-bounce">🐥</div>
                <h2 class="text-xl mb-1 text-yellow-300 drop-shadow">현준이의 플래피 버디</h2>
                <p class="text-xs mb-2 text-white/90">화면을 터치하거나 스페이스바로 날아오르세요!</p>
                
                <!-- 캐릭터 선택 옵션 -->
                <div class="mb-2 text-left">
                    <label class="text-[11px] text-yellow-200 block mb-1">✨ 캐릭터 선택</label>
                    <div class="grid grid-cols-4 gap-1" id="characterSelector">
                        <button onclick="selectCharacter('bird')" class="char-btn bg-white/30 hover:bg-white/50 p-1.5 rounded-xl border-2 border-yellow-300 text-lg transition">🐥</button>
                        <button onclick="selectCharacter('cat')" class="char-btn bg-white/20 hover:bg-white/50 p-1.5 rounded-xl border-2 border-transparent text-lg transition">🐱</button>
                        <button onclick="selectCharacter('rocket')" class="char-btn bg-white/20 hover:bg-white/50 p-1.5 rounded-xl border-2 border-transparent text-lg transition">🚀</button>
                        <button onclick="selectCharacter('ghost')" class="char-btn bg-white/20 hover:bg-white/50 p-1.5 rounded-xl border-2 border-transparent text-lg transition">👻</button>
                    </div>
                </div>

                <!-- 테마 선택 옵션 -->
                <div class="mb-2 text-left">
                    <label class="text-[11px] text-yellow-200 block mb-1">🎨 배경 테마</label>
                    <div class="grid grid-cols-3 gap-1" id="themeSelector">
                        <button onclick="selectTheme('sky')" class="theme-btn bg-sky-400 text-white text-[11px] py-1 px-1 rounded-xl border-2 border-white font-bold transition">낮 하늘</button>
                        <button onclick="selectTheme('sunset')" class="theme-btn bg-rose-400 text-white text-[11px] py-1 px-1 rounded-xl border-2 border-transparent transition">노을</button>
                        <button onclick="selectTheme('night')" class="theme-btn bg-indigo-900 text-white text-[11px] py-1 px-1 rounded-xl border-2 border-transparent transition">우주밤</button>
                    </div>
                </div>

                <!-- 난이도 선택 옵션 -->
                <div class="mb-3 text-left">
                    <label class="text-[11px] text-yellow-200 block mb-1">⚡ 난이도 설정</label>
                    <div class="grid grid-cols-3 gap-1" id="difficultySelector">
                        <button onclick="selectDifficulty('easy')" class="diff-btn bg-white/20 text-white text-[11px] py-1 px-1 rounded-xl border-2 border-transparent transition">쉬움</button>
                        <button onclick="selectDifficulty('normal')" class="diff-btn bg-white/30 text-white text-[11px] py-1 px-1 rounded-xl border-2 border-yellow-300 font-bold transition">보통</button>
                        <button onclick="selectDifficulty('hard')" class="diff-btn bg-white/20 text-white text-[11px] py-1 px-1 rounded-xl border-2 border-transparent transition">어려움</button>
                    </div>
                </div>

                <button id="startBtn" class="bg-yellow-400 hover:bg-yellow-500 text-stone-800 font-bold px-6 py-2 rounded-full text-base shadow-md transition transform active:scale-95 border-2 border-white w-full">
                    게임 시작! 🚀
                </button>
            </div>
        </div>

        <!-- 게임 오버 화면 오버레이 -->
        <div id="gameOverScreen" class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center text-white z-10 hidden p-6 text-center backdrop-blur-[2px]">
            <div class="bg-white/20 p-6 rounded-3xl border-2 border-white/40 shadow-lg w-4/5 max-w-[280px]">
                <span class="text-5xl mb-2 block">💥</span>
                <h2 class="text-3xl mb-1 text-red-300 drop-shadow">게임 오버!</h2>
                <div class="bg-white/10 rounded-xl p-3 my-3">
                    <p class="text-sm text-gray-200">최종 점수</p>
                    <p id="finalScore" class="text-4xl text-yellow-300 font-bold">0</p>
                </div>
                <button id="restartBtn" class="bg-green-400 hover:bg-green-500 text-stone-900 font-bold px-6 py-3 rounded-full text-lg shadow-md transition transform active:scale-95 border-2 border-white w-full">
                    다시 하기 🔄
                </button>
            </div>
        </div>
    </div>

    <!-- 푸터 안내 -->
    <div class="text-white/80 text-sm mt-3 text-center">
        <p>현준이와 함께하는 신나는 쉬는 시간 힐링 게임 ✨</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');

        // 커스텀 설정 상태
        let currentCharacter = 'bird'; // bird, cat, rocket, ghost
        let currentTheme = 'sky';      // sky, sunset, night
        let currentDifficulty = 'normal'; // easy, normal, hard

        function selectCharacter(type) {
            currentCharacter = type;
            document.querySelectorAll('.char-btn').forEach(btn => {
                btn.classList.remove('border-yellow-300', 'bg-white/30');
                btn.classList.add('border-transparent', 'bg-white/20');
            });
            event.currentTarget.classList.remove('border-transparent', 'bg-white/20');
            event.currentTarget.classList.add('border-yellow-300', 'bg-white/30');

            const emojis = { bird: '🐥', cat: '🐱', rocket: '🚀', ghost: '👻' };
            document.getElementById('previewEmoji').innerText = emojis[type];
        }

        function selectTheme(theme) {
            currentTheme = theme;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('border-white', 'font-bold');
                btn.classList.add('border-transparent');
            });
            event.currentTarget.classList.remove('border-transparent');
            event.currentTarget.classList.add('border-white', 'font-bold');

            if (theme === 'sky') {
                gameContainer.style.background = 'linear-gradient(to bottom, #70c5ce, #b4f8c8)';
            } else if (theme === 'sunset') {
                gameContainer.style.background = 'linear-gradient(to bottom, #ff7e5f, #feb47b)';
            } else if (theme === 'night') {
                gameContainer.style.background = 'linear-gradient(to bottom, #0f172a, #312e81)';
            }
        }

        function selectDifficulty(diff) {
            currentDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('border-yellow-300', 'bg-white/30', 'font-bold');
                btn.classList.add('border-transparent', 'bg-white/20');
            });
            event.currentTarget.classList.remove('border-transparent', 'bg-white/20');
            event.currentTarget.classList.add('border-yellow-300', 'bg-white/30', 'font-bold');
        }

        // 난이도별 게임 변수 가져오기
        function getDifficultySettings() {
            if (currentDifficulty === 'easy') {
                return { pipeGap: 160, pipeSpeed: 2.2, gravity: 0.3, lift: -5.8 };
            } else if (currentDifficulty === 'hard') {
                return { pipeGap: 105, pipeSpeed: 3.4, gravity: 0.42, lift: -7.2 };
            } else {
                // normal
                return { pipeGap: 135, pipeSpeed: 2.7, gravity: 0.35, lift: -6.5 };
            }
        }

        // 화면 레티나 대응 및 해상도 설정
        function resizeCanvas() {
            const displayWidth = canvas.clientWidth;
            const displayHeight = canvas.clientHeight;
            if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                canvas.width = 400;
                canvas.height = 533; // 3:4 비율 유지
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 게임 상태 변수
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let frames = 0;
        let diffSettings = getDifficultySettings();

        // 버디(캐릭터) 객체 설정
        const bird = {
            x: 80,
            y: 200,
            radius: 20,
            velocity: 0,
            
            update() {
                this.velocity += diffSettings.gravity;
                this.y += this.velocity;

                // 바닥 충돌 방지 및 게임오버 처리
                if (this.y + this.radius >= canvas.height - 40) {
                    this.y = canvas.height - 40 - this.radius;
                    gameOver();
                }

                // 천장 충돌 방지
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                ctx.rotate(rotation);

                if (currentCharacter === 'bird') {
                    // 노란색 동그란 버디
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFEB3B';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#FBC02D';
                    ctx.stroke();
                    ctx.closePath();

                    // 눈
                    ctx.beginPath();
                    ctx.arc(6, -6, 6, 0, Math.PI * 2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(8, -6, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'black';
                    ctx.fill();

                    // 부리
                    ctx.beginPath();
                    ctx.moveTo(12, -2);
                    ctx.lineTo(22, 2);
                    ctx.lineTo(12, 6);
                    ctx.fillStyle = '#FF9800';
                    ctx.fill();
                    ctx.closePath();
                } else if (currentCharacter === 'cat') {
                    // 고양이 주황빛 몸체
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFA726';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#F57C00';
                    ctx.stroke();
                    ctx.closePath();

                    // 귀
                    ctx.fillStyle = '#FFA726';
                    ctx.beginPath();
                    ctx.moveTo(-14, -10);
                    ctx.lineTo(-22, -22);
                    ctx.lineTo(-6, -16);
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(6, -16);
                    ctx.lineTo(22, -22);
                    ctx.lineTo(14, -10);
                    ctx.fill();
                    ctx.stroke();

                    // 눈 & 수염
                    ctx.fillStyle = 'black';
                    ctx.fillRect(4, -4, 3, 5);
                    ctx.fillRect(-8, -4, 3, 5);
                } else if (currentCharacter === 'rocket') {
                    // 로켓 모형
                    ctx.fillStyle = '#EF4444';
                    ctx.beginPath();
                    ctx.moveTo(-15, 10);
                    ctx.lineTo(20, 0);
                    ctx.lineTo(-15, -10);
                    ctx.closePath();
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#B91C1C';
                    ctx.stroke();

                    // 불꽃
                    ctx.fillStyle = '#F59E0B';
                    ctx.beginPath();
                    ctx.moveTo(-15, 6);
                    ctx.lineTo(-25, 0);
                    ctx.lineTo(-15, -6);
                    ctx.fill();
                } else if (currentCharacter === 'ghost') {
                    // 유령 모형
                    ctx.fillStyle = '#F8FAFC';
                    ctx.beginPath();
                    ctx.arc(0, -5, this.radius - 2, Math.PI, 0, false);
                    ctx.lineTo(this.radius - 2, 15);
                    ctx.lineTo(10, 8);
                    ctx.lineTo(0, 15);
                    ctx.lineTo(-10, 8);
                    ctx.lineTo(-this.radius + 2, 15);
                    ctx.closePath();
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#CBD5E1';
                    ctx.stroke();

                    // 유령 눈
                    ctx.fillStyle = '#0F172A';
                    ctx.beginPath();
                    ctx.arc(4, -6, 3, 0, Math.PI * 2);
                    ctx.arc(-4, -6, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            },

            flap() {
                this.velocity = diffSettings.lift;
            }
        };

        // 기둥 배열
        let pipes = [];
        const pipeWidth = 60;

        class Pipe {
            constructor() {
                this.x = canvas.width;
                this.topHeight = Math.floor(Math.random() * (canvas.height - diffSettings.pipeGap - 160)) + 60;
                this.bottomY = this.topHeight + diffSettings.pipeGap;
                this.passed = false;
            }

            update() {
                this.x -= diffSettings.pipeSpeed;
            }

            draw() {
                let pipeColor = '#66BB6A';
                let pipeBorder = '#388E3C';
                let pipeCap = '#81C784';

                if (currentTheme === 'sunset') {
                    pipeColor = '#EC4899';
                    pipeBorder = '#BE185D';
                    pipeCap = '#F472B6';
                } else if (currentTheme === 'night') {
                    pipeColor = '#3B82F6';
                    pipeBorder = '#1D4ED8';
                    pipeCap = '#60A5FA';
                }

                // 위쪽 기둥
                ctx.fillStyle = pipeColor;
                ctx.fillRect(this.x, 0, pipeWidth, this.topHeight);
                ctx.strokeStyle = pipeBorder;
                ctx.lineWidth = 3;
                ctx.strokeRect(this.x, 0, pipeWidth, this.topHeight);
                ctx.fillStyle = pipeCap;
                ctx.fillRect(this.x - 4, this.topHeight - 20, pipeWidth + 8, 20);
                ctx.strokeRect(this.x - 4, this.topHeight - 20, pipeWidth + 8, 20);

                // 아래쪽 기둥
                ctx.fillStyle = pipeColor;
                ctx.fillRect(this.x, this.bottomY, pipeWidth, canvas.height - this.bottomY - 40);
                ctx.strokeRect(this.x, this.bottomY, pipeWidth, canvas.height - this.bottomY - 40);
                ctx.fillStyle = pipeCap;
                ctx.fillRect(this.x - 4, this.bottomY, pipeWidth + 8, 20);
                ctx.strokeRect(this.x - 4, this.bottomY, pipeWidth + 8, 20);
            }
        }

        // 배경 요소 (구름)
        let clouds = [
            { x: 50, y: 80, speed: 0.5, size: 40 },
            { x: 220, y: 150, speed: 0.3, size: 30 },
            { x: 350, y: 70, speed: 0.6, size: 50 }
        ];

        function drawBackground() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x < -60) cloud.x = canvas.width + 50;

                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size * 0.6, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.5, cloud.y - cloud.size * 0.2, cloud.size * 0.4, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.9, cloud.y, cloud.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // 바닥 (땅)
            let groundColor = '#8D6E63';
            let grassColor = '#4CAF50';
            if (currentTheme === 'sunset') {
                groundColor = '#78350F';
                grassColor = '#D97706';
            } else if (currentTheme === 'night') {
                groundColor = '#1E293B';
                grassColor = '#475569';
            }

            ctx.fillStyle = groundColor;
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = grassColor;
            ctx.fillRect(0, canvas.height - 40, canvas.width, 12);
        }

        // 충돌 감지 함수
        function checkCollision(pipe) {
            let birdLeft = bird.x - bird.radius + 5;
            let birdRight = bird.x + bird.radius - 5;
            let birdTop = bird.y - bird.radius + 5;
            let birdBottom = bird.y + bird.radius - 5;

            if (birdRight > pipe.x && birdLeft < pipe.x + pipeWidth) {
                if (birdTop < pipe.topHeight || birdBottom > pipe.bottomY) {
                    return true;
                }
            }
            return false;
        }

        // 게임 루프
        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            frames++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();

            if (frames % 100 === 0) {
                pipes.push(new Pipe());
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].update();
                pipes[i].draw();

                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    score++;
                    pipes[i].passed = true;
                }

                if (checkCollision(pipes[i])) {
                    gameOver();
                }

                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }

            bird.update();
            bird.draw();

            // 점수 표시
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px "Jua"';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
            ctx.shadowBlur = 4;
            ctx.fillText(score, canvas.width / 2, 50);
            ctx.shadowBlur = 0;

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            diffSettings = getDifficultySettings();
            gameState = 'PLAYING';
            score = 0;
            frames = 0;
            pipes = [];
            bird.y = 200;
            bird.velocity = 0;
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            gameLoop();
        }

        function gameOver() {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // 이벤트 리스너 설정
        function handleAction(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.type === 'keydown') e.preventDefault();

            if (gameState === 'PLAYING') {
                bird.flap();
            }
        }

        window.addEventListener('keydown', handleAction);
        canvas.addEventListener('click', () => {
            if (gameState === 'PLAYING') bird.flap();
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'PLAYING') bird.flap();
        }, { passive: false });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

    </script>
</body>
</html>
